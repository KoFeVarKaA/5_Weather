networks:
  dev:
services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - 8000
    depends_on:
      - postgres
      - redis
    volumes:
      - static_volume:/user/static
    command: >
          sh -c "python manage.py collectstatic --noinput &&
                 chmod -R 755 /user/static &&
                 python manage.py migrate &&
                 gunicorn siteweather.wsgi:application --bind 0.0.0.0:8000"
    networks:
      - dev

  redis:
    image: redis:7.2-alpine 
    container_name: redis_cache
    expose:
      - 6379
    networks:
      - dev

  postgres:
    image: postgres:14.3
    environment:
      POSTGRES_DB: "main"
      POSTGRES_USER: "root"
      POSTGRES_PASSWORD: "password"
    ports:
      - "5435:5432"
    networks:
      - dev

  nginx:
    build:
      context: ./docker/nginx/
    volumes:
      - static_volume:/user/static
    depends_on:
      - django
    ports:
      - "80:80"
    networks:
      - dev

volumes:
  static_volume:
  postgres_data: