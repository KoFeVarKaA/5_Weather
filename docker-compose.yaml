networks:
  dev:
services:
  redis:
    image: redis:7.2-alpine 
    container_name: redis_cache
    ports:
      - "6379:6379"

  postgres:
    image: postgres:14.3
    environment:
      POSTGRES_DB: "main"
      POSTGRES_USER: "root"
      POSTGRES_PASSWORD: "password"
    ports:
      - "5435:5432"
    networks:
      - dev