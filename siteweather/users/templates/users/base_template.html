{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="icon" href="{% static 'favicon2.ico' %}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="p-3 border-bottom">
        <div class="container">
            <a href="{% url 'home' %}" class="text-decoration-none text-dark">
                <h1 class="m-0">Погодный сервис</h1>
            </a>
        </div>
    </header>

    <div class="d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 60px);">
    <div class="container" style="max-width: 400px;">
        <h2 class="text-center mb-4">{{ title }}</h2>

        <form method="post" class="needs-validation" novalidate style="width: 100%; max-width: 400px;">
            {% csrf_token %}

            {% if form.non_field_errors%}
                <div class="alert alert-danger mb-3">{{ form.non_field_errors }}</div>
            {% endif %}

            {% for f in form %}
            <div class="mb-3 w-100">
                <div>
                    <label class="form-label" for="{{ f.id_for_label }}">{{ f.label }}</label>
                    {{ f }}
                    {% if f.errors %}
                        <div class="alert alert-danger p-2 mb-0"><small>
                            {% for error in f.errors %}
                                {{ error }}<br>
                            {% endfor %}
                        </small></div>
                    {% endif %}
                </div>
                <div class="invalid-feedback form-error">{{ f.errors }}</div>
            </div>
            {% endfor %}
            
            <div class="d-grid gap-2 mb-3">
                <button type="submit" class="btn btn-primary">{{ button_text }}</button>
            </div>
        </form>
    
    </div>
    </div>
</body>
</html>
