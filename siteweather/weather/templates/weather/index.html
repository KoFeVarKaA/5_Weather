<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <h1>Погодный сервис</h1> <!-- Блок кнопок для авторизации -->
        <div>
            {% if user.is_authenticated %}
                <span class="me-3">Добро пожаловать, {{ user.username }}!</span>
                <a href="{% url 'logout' %}" class="btn btn-outline-danger">     Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-primary me-2">Авторизация</a>
                <a href="{% url 'register' %}" class="btn btn-primary">          Регистрация</a>
            {% endif %}
        </div>
    </header>

        <!-- Поле поиска -->
        <div class="mb-4">
            <form method="GET" action="{% url 'index' %}" class="d-flex">
                <input
                    type="text"
                    name="search"
                    class="form-control me-2"
                    placeholder="Введите название локации..."
                    value="{{ search_query|default:'' }}"
                >
                <button type="submit" class="btn btn-primary">Поиск</button>
            </form>
        </div>

        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
